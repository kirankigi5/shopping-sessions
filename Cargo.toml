[package]
name = "solution"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
libc = "0.2.191"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
parquet = { version = "60.2.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[features]
diag = []
