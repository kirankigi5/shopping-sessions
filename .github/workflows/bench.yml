name: bench
on:
  push:
    branches: [bench]
  workflow_dispatch:
env:
  BASE: 8a5c454874495f991205f9e98707e47bdd51bb2d
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: machine
        run: lscpu | grep -E "Model name|^CPU\(s\)"
      - name: tools
        run: |
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 >/dev/null
      - name: build
        run: |
          export RUSTFLAGS="-C target-cpu=x86-64-v3 -C force-frame-pointers=yes" CARGO_PROFILE_RELEASE_DEBUG=line-tables-only
          cargo build --release --locked -q && cp target/release/solution /tmp/new
          git worktree add -q /tmp/base $BASE && (cd /tmp/base && cargo build --release --locked -q --target-dir /tmp/tb) && cp /tmp/tb/release/solution /tmp/base.bin
          (cd gen && cargo build --release -q)
      - name: generate 20M into tmpfs
        run: gen/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output /dev/shm/d >/dev/null
      - name: correctness (new vs base output)
        run: |
          rm -rf /tmp/oa /tmp/ob; mkdir /tmp/oa /tmp/ob
          DATA_DIR=/dev/shm/d OUTPUT_DIR=/tmp/oa /tmp/base.bin 2>/dev/null; DATA_DIR=/dev/shm/d OUTPUT_DIR=/tmp/ob /tmp/new 2>/dev/null
          pip install -q pyarrow >/dev/null 2>&1
          python3 -c "
          import pyarrow.parquet as pq
          for t in ['user_daily','campaign_daily']:
              a=pq.read_table('/tmp/oa/'+t); b=pq.read_table('/tmp/ob/'+t)
              cols=sorted(a.column_names); k=[(c,'ascending') for c in cols]
              a=a.select(cols).sort_by(k); b=b.select(cols).sort_by(k)
              print(t, 'MATCH' if a.equals(b) else 'DIFF', a.num_rows, b.num_rows)
          "
      - name: A/B timing
        run: |
          for r in 1 2 3 4 5 6; do for b in base.bin new; do rm -rf /tmp/o; mkdir /tmp/o
            s=$(date +%s%N); NCPU=4 DATA_DIR=/dev/shm/d OUTPUT_DIR=/tmp/o /tmp/$b 2>/dev/null; e=$(date +%s%N)
            echo "$b $(( (e-s)/1000000 ))" >> /tmp/ab.txt; done; done
          python3 -c "
          import collections; d=collections.defaultdict(list)
          for l in open('/tmp/ab.txt'): n,v=l.split(); d[n].append(int(v))
          for n,v in d.items(): print(f'{n:9s} min {min(v)} med {sorted(v)[len(v)//2]} all {v}')
          "
      - name: perf (new)
        run: |
          rm -rf /tmp/o; mkdir /tmp/o
          perf record -F 999 -o /tmp/perf.data env NCPU=4 DATA_DIR=/dev/shm/d OUTPUT_DIR=/tmp/o /tmp/new 2>&1 | tail -1
          perf report -i /tmp/perf.data --stdio --no-children --sort sym 2>/dev/null | grep -v '^#' | grep -v '^$' | head -16 | cut -c1-140
          for pat in 'parallel_fin.*closure#0' 'parse_events::.closure#0' 'parse_clicks::.closure#0' 'parse_events$'; do
            sym=$(perf report -i /tmp/perf.data --stdio --no-children --sort sym 2>/dev/null | grep -v '^#' | grep -m1 -E "$pat" | sed -E 's/.*\[\.\] //')
            echo "=== $pat"
            perf annotate -i /tmp/perf.data --stdio -l "$sym" 2>/dev/null | grep -E '^ +[0-9]+\.[0-9]+ +[a-z_0-9]+\.rs:[0-9]+' | sort -rn | head -22
          done
